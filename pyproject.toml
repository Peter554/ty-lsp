[project]
name = "ty-lsp"
version = "0.1.0"
description = "A Python library for querying code with ty's language server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.3",
    "ty>=0.0.98",
]



[build-system]
requires = ["uv_build>=0.9.1,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pdoc>=16.0.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
